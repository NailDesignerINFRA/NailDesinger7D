# ============================================================
# Cloudflare Workers + Static Assets — Nail Designer 7D
# Site estatico (HTML/CSS/JS puro) servido via Workers Assets.
# Deploy via `wrangler deploy` (rodado automaticamente pelo
# pipeline do Cloudflare em todo push pra main).
# ============================================================

name = "naildesigner7d"
compatibility_date = "2025-05-23"

# Diretorio de assets estaticos servidos pelo Worker.
# "." = raiz do repo (onde estao index.html, styles.css, etc).
[assets]
directory = "."
not_found_handling = "404-page"
